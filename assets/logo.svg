<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Ease</title>
  <desc id="d">A username handle above two wallets with an arrow between them: value moving wallet to wallet, with no intermediary.</desc>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#f4f6f4"/>
  <ellipse cx="256" cy="430" rx="150" ry="18" fill="#059669" opacity=".13" filter="url(#soft)"/>

  <!--
    The whole product in three marks: a name at the top, two wallets, and a
    value arrow that goes straight from one to the other. There is deliberately
    no middle box, no escrow vault and no third party - Ease never holds the
    money, and the arrow crossing that empty space is the claim.
  -->
  <g transform="translate(0,10)">
    <!-- the name people actually send to, above everything -->
    <g fill="none" stroke="#059669" stroke-width="17" stroke-linecap="round">
      <path d="M206 118c0-17 14-30 31-30h14c17 0 31 13 31 30v34"/>
      <path d="M306 118c0-17-14-30-31-30h-14c-17 0-31 13-31 30v34"/>
    </g>

    <!-- the arrow: value, moving straight across -->
    <g stroke="#059669" stroke-width="19" stroke-linecap="round" fill="none">
      <path d="M148 262h206"/>
    </g>
    <path d="M330 226l44 36-44 36z" fill="#059669"/>

    <!-- payer wallet, left -->
    <rect x="118" y="330" width="116" height="76" rx="17" fill="url(#g)"/>
    <rect x="140" y="356" width="42" height="9" rx="4.5" fill="#04150f" opacity=".85"/>

    <!-- agent wallet, right -->
    <rect x="278" y="330" width="116" height="76" rx="17" fill="url(#g)"/>
    <rect x="300" y="356" width="42" height="9" rx="4.5" fill="#04150f" opacity=".85"/>
  </g>
</svg>
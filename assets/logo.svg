<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Ease</title>
  <desc id="d">A bold letter E: three horizontal arms on a vertical stem, the middle arm shortened for optical balance.</desc>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#g)"/>

  <!--
    One letter, drawn as construction rather than a typeface: three arms with
    rounded right terminals, and a stem laid over them so the left edge comes
    out square without needing a compound path.

    The middle arm is deliberately shorter. Equal-length arms read as a menu
    icon at favicon sizes; shortening the middle is what separates a letterform
    from a hamburger, and it optically centres the mass between the two long
    arms.

    On a 4px grid, 56px stroke weight, 80px vertical gaps.
  -->
  <g fill="#04150f">
    <rect x="148" y="144" width="216" height="56" rx="28"/>
    <rect x="148" y="224" width="184" height="56" rx="28"/>
    <rect x="148" y="312" width="216" height="56" rx="28"/>
    <!-- stem last: squares the left edge and ties the arms together -->
    <rect x="148" y="144" width="56" height="224"/>
  </g>
</svg>
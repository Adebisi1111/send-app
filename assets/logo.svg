<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Ease</title>
  <desc id="d">A letter E in the app's brand green on the app's paper background.</desc>

  <!--
    Colours taken from src/tokens.css, not invented:
      paper    #f4f6f4   the page background
      brand    #0d6f4c   5.69:1 on paper, 6.19:1 on white
      brand-hi #0f8259   the hover step, gradient's lighter end
      ink      #16211a   15.27:1 on paper

    The previous version inverted this - bright green tile, near-black letter -
    against an app that is light paper with deep green ink. Same two colours,
    wrong way round, so it never sat with the product.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8259"/>
      <stop offset="1" stop-color="#0d6f4c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#f4f6f4"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#brand)"/>

  <!--
    Three arms with rounded right terminals, and a stem laid over them so the
    left edge is square without a compound path. The middle arm is shorter on
    purpose: at favicon size three equal bars read as a hamburger menu.

    On a 4px grid, 56px stroke weight, 80px vertical gaps. The mark sits on a
    tile rather than the bare page background so the icon keeps a defined edge
    when placed on a dark surface.
  -->
  <g fill="#ffffff">
    <rect x="148" y="144" width="216" height="56" rx="28"/>
    <rect x="148" y="224" width="184" height="56" rx="28"/>
    <rect x="148" y="312" width="216" height="56" rx="28"/>
    <rect x="148" y="144" width="56" height="224"/>
  </g>
</svg>